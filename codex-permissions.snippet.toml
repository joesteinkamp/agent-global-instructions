# >>> agent-global-instructions (codex permissions) >>>
# Mirrors the deny/ask intent of settings-permissions.snippet.json using Codex's
# stable, widely-supported keys. Codex's sandbox is directory-scoped rather than
# per-glob, so the fine-grained path denies (.env, lockfiles, build/ dist/ out/
# coverage/ node_modules/ .git/) are enforced by the guard-paths hook instead;
# this block is the coarse native backstop:
#   - workspace-write keeps edits inside the workspace (no stray writes elsewhere),
#   - on-request pauses for approval before escaping the sandbox or running risky
#     commands (the closest native analog to Claude's `ask` on sudo).
# Verify these keys against your Codex version (`codex --help`,
# developers.openai.com/codex) — newer builds may expose a richer permissions model.
approval_policy = "on-request"
sandbox_mode = "workspace-write"
# Network INSIDE the sandbox. workspace-write disables it by default on every
# platform (seatbelt on macOS, bubblewrap/landlock on Linux) — and a network-
# starved agent CLI does not fail, it retries silently until something kills it.
# That makes this the single setting that decides whether the cross-CLI
# delegation in ~/.ai/orchestration.md works at all: `claude -p` / `agent -p` /
# `codex exec` are network clients, so with it off every delegate hangs and the
# orchestrator reports that they "never responded". Headless `codex exec` runs
# at approval=never, so the per-command escalation path cannot rescue it either.
# Inline-table form on purpose: a `[sandbox_workspace_write]` section here would
# swallow any bare top-level key that follows this block in the user's config.
sandbox_workspace_write = { network_access = true }
# <<< agent-global-instructions (codex permissions) <<<
